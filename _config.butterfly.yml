# ========== 导航菜单 ==========
nav:
  fixed: true

# 去掉首页大片纯色 banner
disable_top_img: true
index_top_img_height: 0

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder

# ========== 头像 ==========
avatar:
  img: /lzr.png
  effect: false

# ========== 社交链接 ==========
social:
  fas fa-blog: https://lzr-yctf1883.top || 博客
  fab fa-github: https://github.com/YCTF1883 || GitHub

# ========== 字体和代码块 ==========
font:
  font_family: '"Microsoft YaHei", "Heiti SC", "PingFang SC", sans-serif'
  code_font_family: '"Fira Code", Consolas, monospace'

code_blocks:
  theme: light
  macStyle: true
  copy: true

highlight_theme: mac

# ========== 文章页 ==========
post_meta:
  page:
    date_type: created
    categories: true
    tags: true

# ========== 暗黑模式 ==========
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# ========== 侧边栏 ==========
aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: CS本科 · 自动驾驶实习 · Java/AI方向
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/YCTF1883
  card_announcement:
    enable: true
    content: 🚗 自动驾驶现场部署实习生<br>📝 记录学习与成长
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 20
  card_archives:
    enable: true
    type: monthly
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ========== 文章版权 ==========
post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# ========== 页脚 ==========
footer:
  owner:
    since: 2026
  copyright: true

# ========== 蓝绿配色 ==========
theme_color:
  enable: true
  main: "#20B2AA"
  paginator: "#20B2AA"
  button_hover: "#008B8B"
  text_selection: "#20B2AA"
  link_color: "#20B2AA"
  hr_color: "#5F9EA0"
  scrollbar_color: "#20B2AA"

# ========== 圆角 ==========
rounded_corners_ui: true

# ========== 粒子特效（点线互动） ==========
canvas_nest:
  enable: true
  color: "32,178,170"
  opacity: 0.6
  zIndex: -1
  count: 80
  mobile: false

# ========== 鼠标点击特效 ==========
click_heart:
  enable: true
  mobile: false

clickShowText:
  enable: true
  text:
    - 🚗
    - 🚀
    - 💪
    - ✨
    - 📝
    - 🎯
    - 🌟
    - 🔥
  fontSize: 18px
  mobile: false

# ========== 自定义 CSS ==========
inject:
  bottom:
    - <style>/*全站蓝绿磨砂*/.card-widget,.recent-post-item,#post,#page,#archive,#category,#tag,#rightside,#toc,#pagination .page-number,#pagination .extend{backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}#nav{backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);background:rgba(255,255,255,.62)!important;border-bottom:1px solid rgba(32,178,170,.18)}[data-theme="dark"] #nav{background:rgba(12,12,12,.78)!important;border-bottom:1px solid rgba(32,178,170,.3)}.recent-post-item{border-radius:16px;background:rgba(255,255,255,.58)!important;border:1px solid rgba(32,178,170,.1);box-shadow:0 2px 12px rgba(32,178,170,.06);transition:all .3s ease}.recent-post-item:hover{box-shadow:0 8px 30px rgba(32,178,170,.14);transform:translateY(-3px);border-color:rgba(32,178,170,.25)}[data-theme="dark"] .recent-post-item{background:rgba(20,20,20,.72)!important;border:1px solid rgba(32,178,170,.2)}[data-theme="dark"] .recent-post-item:hover{border-color:rgba(32,178,170,.4)}.card-widget{border-radius:14px;background:rgba(255,255,255,.58)!important;border:1px solid rgba(32,178,170,.08);box-shadow:0 2px 10px rgba(32,178,170,.04)}[data-theme="dark"] .card-widget{background:rgba(20,20,20,.72)!important;border:1px solid rgba(32,178,170,.2)}#post,#page,#archive,#category,#tag{border-radius:16px;background:rgba(255,255,255,.62)!important;border:1px solid rgba(32,178,170,.08);padding:28px}[data-theme="dark"] #post,[data-theme="dark"] #page,[data-theme="dark"] #archive,[data-theme="dark"] #category,[data-theme="dark"] #tag{background:rgba(20,20,20,.72)!important;border:1px solid rgba(32,178,170,.2)}#rightside{background:rgba(255,255,255,.7)!important;border-radius:14px!important;padding:5px;border:1px solid rgba(32,178,170,.15);box-shadow:0 4px 20px rgba(32,178,170,.08)}[data-theme="dark"] #rightside{background:rgba(18,18,18,.82)!important;border:1px solid rgba(32,178,170,.25)}#rightside>div>button,#rightside>div>a{background:rgba(32,178,170,.08)!important;border-radius:10px!important;margin:2px 0;transition:background .2s,transform .2s}#rightside>div>button:hover,#rightside>div>a:hover{background:rgba(32,178,170,.22)!important;transform:scale(1.05)}.pagination .page-number,.pagination .extend{border-radius:10px;background:rgba(255,255,255,.58)!important;border:1px solid rgba(32,178,170,.12)}[data-theme="dark"] .pagination .page-number,[data-theme="dark"] .pagination .extend{background:rgba(20,20,20,.72)!important}.pagination .page-number.current{background:rgba(32,178,170,.25)!important;border-color:rgba(32,178,170,.4)}.tag-cloud a,.category-list a{border-radius:10px;background:rgba(32,178,170,.07)!important;border:1px solid rgba(32,178,170,.12);backdrop-filter:blur(6px);transition:all .2s}.tag-cloud a:hover,.category-list a:hover{background:rgba(32,178,170,.18)!important;border-color:rgba(32,178,170,.3)}[data-theme="dark"] .tag-cloud a,[data-theme="dark"] .category-list a{background:rgba(32,178,170,.1)!important}#search-input{border-radius:12px;background:rgba(255,255,255,.55)!important;backdrop-filter:blur(8px);border:1px solid rgba(32,178,170,.15)}[data-theme="dark"] #search-input{background:rgba(20,20,20,.65)!important}figure.highlight,#article-container pre{border-radius:12px}#vcomments,#waline{border-radius:16px;background:rgba(255,255,255,.58)!important;backdrop-filter:blur(12px);padding:20px;border:1px solid rgba(32,178,170,.08)}[data-theme="dark"] #vcomments,[data-theme="dark"] #waline{background:rgba(20,20,20,.72)!important}blockquote{border-left:4px solid rgba(32,178,170,.5)!important;background:rgba(32,178,170,.06)!important;border-radius:0 10px 10px 0}</style>

# ========== 关闭 ==========
reward:
  enable: false

comments:
  use: false

canvas_ribbon:
  enable: false
